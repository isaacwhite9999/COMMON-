<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appearance · COMMON</title>
  <link rel="stylesheet" href="../../shared/shell.css">
  <link rel="stylesheet" href="../../shared/home.css">
  <script defer src="../../shared/shell.js"></script>
</head>
<body>
  <header class="common-shell" data-common-shell="appearance"></header>
  <main class="common-home">
    <h1>Appearance</h1>
    <p>Change the spacing of COMMON navigation and home tools in this browser.</p>
    <label for="common-density">Display density</label>
    <select id="common-density">
      <option value="comfortable">Comfortable</option>
      <option value="compact">Compact</option>
    </select>
    <p id="common-preference-status" role="status"></p>
  </main>
</body>
</html>
