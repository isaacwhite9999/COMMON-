name: Check COMMON frontend and API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/check-common.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check docs/design-v3.js
          node --check docs/live-community.js
          node --check docs/lab/research-engine.js
          node --check docs/lab/lab.js
          node tests/research-engine.test.cjs
          node --check docs/terminal/terminal.js
          node --check docs/terminal/analytics.js
          node tests/finance-terminal.test.cjs
          node --check docs/config.js
          node --check docs/demo-api.js
          node --check docs/app.js
          node --check static/app.js
      - name: Verify all local frontend assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Resources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  u = d.get('src') or d.get('href')
                  if u and u.startswith('./'):
                      self.paths.append(u)
          for doc in [Path('docs/index.html'), Path('docs/live/index.html'), Path('docs/terminal/index.html'), Path('docs/preview.html')]:
              p = Resources()
              p.feed(doc.read_text())
              missing = [path for path in p.paths if not (doc.parent / path).is_file() and not (doc.parent / path / 'index.html').is_file()]
              assert not missing, f'Missing assets in {doc}: {missing}'
              print('Assets verified:', doc, ', '.join(p.paths))
          PY

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API security and functional tests
        run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: common_test
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: common_test_api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U common_test -d common_test_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COMMON_TEST_POSTGRES_DSN: postgresql://common_test:disposable@127.0.0.1:5432/common_test_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_api_postgres.py
      - run: python scripts/load_api.py --population 1000 --concurrency 8 --rounds 5
