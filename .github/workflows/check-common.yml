name: Check COMMON frontend and API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/check-common.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check docs/design-v3.js
          node --check docs/live-community.js
          node --check docs/config.js
          node --check docs/demo-api.js
          node --check docs/app.js
          node --check static/app.js
      - name: Verify all local frontend assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Resources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  u = d.get('src') or d.get('href')
                  if u and u.startswith('./'):
                      self.paths.append(u)
          for doc in [Path('docs/index.html'), Path('docs/live/index.html')]:
              p = Resources()
              p.feed(doc.read_text())
              missing = [path for path in p.paths if not (doc.parent / path).is_file()]
              assert not missing, f'Missing assets in {doc}: {missing}'
              print('Assets verified:', doc, ', '.join(p.paths))
          PY

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API security and functional tests
        run: pytest -q
