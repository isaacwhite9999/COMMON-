name: Discussion feed browser checks

on:
  pull_request:
    paths:
      - 'docs/live/**'
      - 'docs/live-community.js'
      - 'tests/discussion-feed-browser.test.mjs'
      - 'tests/research-journey.test.mjs'
      - 'tests/publishing-draft-browser.test.mjs'
      - 'docs/shared/research-draft.js'
      - 'docs/workspace/**'
      - 'docs/lab/**'
      - '.github/workflows/discussion-feed-browser.yml'

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify scoped discussion feeds
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs >/tmp/common-discussion-feed.log 2>&1 &
          trap 'kill $!' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/live/ >/dev/null
          node tests/discussion-feed-browser.test.mjs
          COMMON_DESKTOP=1 node tests/discussion-feed-browser.test.mjs
          node tests/research-journey.test.mjs
          node tests/publishing-draft-browser.test.mjs
