name: Validate community database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema-drafts/**'
      - 'tests/pg_*.sql'
      - 'tests/recovery-drill.py'
      - '.github/workflows/test-community-db.yml'
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: common_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d common_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: common_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare Supabase auth compatibility
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_prepare.sql
      - name: Apply migrations sequentially
        run: |
          for sql in supabase/migrations/*.sql; do
            echo "Applying $sql"
            psql -X -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Verify private member connection requests and recipient consent
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_member_connections_smoke.sql
      - name: Verify direct message privacy and recipient consent
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_message_privacy_smoke.sql
      - name: Verify authorized message deletion and private retention
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_chat_deletion_smoke.sql
      - name: Verify followed member access, lists and timelines
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_member_following_smoke.sql
      - name: Verify project assistant draft retention and access
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_project_assistant_smoke.sql
      - name: Verify identity, membership and private group isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_rls_smoke.sql
      - name: Verify meme-coin fraud quarantine and review permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_moderation_smoke.sql
      - name: Verify independent appeals and account sanctions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_enforcement_smoke.sql
      - name: Verify private research workspaces and experiment RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_research_smoke.sql
      - name: Verify discussion feed visibility, keyset pagination and query plans
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_discussion_feed_smoke.sql
      - name: Verify research handoff publication and revocation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_research_handoff_smoke.sql
      - name: Verify synced discussion drafts and atomic publication
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pg_discussion_drafts_smoke.sql
      - name: Validate external recordkeeping schema draft in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/schema-drafts/external-journal.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/pg_external_journal_smoke.sql

  recovery-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL 16 server binaries if needed
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - run: pip install 'psycopg[binary]==3.3.9'
      - run: python tests/recovery-drill.py --postgres-bin /usr/lib/postgresql/16/bin
