name: Validate durable PostgreSQL jobs

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/pg_jobs_integration.py'
      - '.github/workflows/test-durable-jobs.yml'

permissions:
  contents: read

jobs:
  job-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: common_jobs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d common_jobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.3.9'
      - run: python tests/pg_jobs_integration.py
